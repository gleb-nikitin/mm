<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mm - /api/v1/sessions/active</title>
  <style>
    :root {
      --bg: #0a0e14;
      --panel-bg: rgba(255, 255, 255, 0.035);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #e6edf3;
      --text-muted: rgba(230, 237, 243, 0.55);
      --accent: #7ec8e3;
      --accent-2: #b794f6;
      --danger: #f87171;
      --accent-glow: rgba(126, 200, 227, 0.15);
      --blur: 16px;
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px;
      --r: 8px;
      --f: 'Monaco', 'Menlo', 'Consolas', monospace;
      --tr: 150ms ease-out;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      background:
        radial-gradient(ellipse 800px 600px at 15% 10%, rgba(126, 200, 227, 0.10) 0%, transparent 55%),
        radial-gradient(ellipse 700px 500px at 85% 90%, rgba(183, 148, 246, 0.10) 0%, transparent 55%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--f);
      font-size: 14px;
      line-height: 1.55;
    }

    .app { max-width: 1180px; margin: 0 auto; padding: var(--sp-6) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }
    .title { font-size: 13px; font-weight: 700; letter-spacing: 0.28em; color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); padding: 0 var(--sp-2); }
    .endpoint { color: var(--text-muted); font-size: 12px; padding: 0 var(--sp-2); margin-top: calc(-1 * var(--sp-2)); overflow-wrap: anywhere; }
    .panel {
      background: var(--panel-bg);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border: 1px solid var(--panel-border);
      border-radius: var(--r);
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.35);
    }
    .controls { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)) auto auto; gap: var(--sp-2); padding: var(--sp-3); align-items: end; }
    label { display: flex; flex-direction: column; gap: var(--sp-1); color: var(--text-muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    input {
      width: 100%;
      min-width: 0;
      padding: var(--sp-2) var(--sp-3);
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      outline: none;
    }
    input:focus { border-color: rgba(126, 200, 227, 0.5); }
    .toggle { flex-direction: row; align-items: center; align-self: center; text-transform: none; letter-spacing: 0; white-space: nowrap; }
    .toggle input { width: auto; }
    .btn {
      padding: var(--sp-2) var(--sp-3);
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { background: rgba(126, 200, 227, 0.1); }
    .meta { display: flex; justify-content: space-between; gap: var(--sp-3); padding: 0 var(--sp-3) var(--sp-3); color: var(--text-muted); font-size: 11px; flex-wrap: wrap; }
    .status.error { color: var(--danger); }
    .table-wrap { overflow-x: auto; padding: var(--sp-3); }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border-bottom: 1px solid var(--panel-border); padding: var(--sp-2); text-align: left; vertical-align: top; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    th { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    td { color: var(--text); font-size: 12px; }
    tr:hover td { background: rgba(255, 255, 255, 0.025); }
    .section-label { color: var(--accent-2); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: var(--sp-3) var(--sp-3) 0; }
    .null { color: var(--accent-2); font-style: italic; }
    pre { margin: 0; padding: var(--sp-4); overflow: auto; max-height: 70vh; color: var(--text); font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    @media (max-width: 860px) { .controls { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .controls { grid-template-columns: 1fr; } .toggle { align-self: start; } }
  </style>
</head>
<body>
<!--NAV-->
  <main class="app">
    <div class="title">MNEMONIC · R1 MONITOR</div>
    <div class="endpoint">Monitoring: GET /api/v1/sessions/active</div>

    <section class="panel">
      <div class="controls">
        <label>project <input id="project" type="text" placeholder="mm" autocomplete="off" /></label>
        <label>role <input id="role" type="text" placeholder="devops" autocomplete="off" /></label>
        <label>state <input id="state" type="text" placeholder="working,idle,wedged" autocomplete="off" /></label>
        <label>limit <input id="limit" type="number" min="1" max="200" placeholder="50" /></label>
        <label class="toggle"><input id="autoRefresh" type="checkbox" /> auto-refresh 5s</label>
        <button id="rawToggle" class="btn" type="button">View raw JSON</button>
      </div>
      <div class="meta">
        <span id="requestUrl"></span>
        <span id="status" class="status"></span>
      </div>
    </section>

    <section class="panel" id="result"></section>
  </main>

  <script>
    const fields = ['project_role', 'participant_id', 'session_id', 'vendor', 'model', 'started_at', 'last_activity_at', 'last_log_line', 'state'];
    const inputs = ['project', 'role', 'state', 'limit'].map(id => document.getElementById(id));
    const resultEl = document.getElementById('result');
    const requestUrlEl = document.getElementById('requestUrl');
    const statusEl = document.getElementById('status');
    const rawToggle = document.getElementById('rawToggle');
    const autoRefresh = document.getElementById('autoRefresh');
    let lastBody = null;
    let rawMode = false;
    let autoTimer = null;
    let debounceTimer = null;

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function valueText(value) {
      if (value === null) return '<span class="null">null</span>';
      if (value === undefined) return '';
      if (typeof value === 'object') return escapeHtml(JSON.stringify(value));
      return escapeHtml(value);
    }

    function buildUrl() {
      const url = new URL('/api/v1/sessions/active', location.origin);
      for (const input of inputs) {
        const value = input.value.trim();
        if (value) url.searchParams.set(input.id, value);
      }
      return url;
    }

    function renderTable(body) {
      if (body && body.error) {
        const details = body.error.details ?? {};
        return `
          <div class="section-label">error</div>
          <div class="table-wrap"><table><tbody>
            <tr><th>code</th><td title="${escapeHtml(body.error.code)}">${valueText(body.error.code)}</td></tr>
            <tr><th>message</th><td title="${escapeHtml(body.error.message)}">${valueText(body.error.message)}</td></tr>
            <tr><th>details</th><td title="${escapeHtml(JSON.stringify(details))}">${valueText(details)}</td></tr>
          </tbody></table></div>`;
      }
      const sessions = Array.isArray(body?.sessions) ? body.sessions : [];
      const headers = fields.map(field => `<th>${field}</th>`).join('');
      const rows = sessions.map(row => `<tr>${fields.map(field => {
        const raw = row[field];
        const title = raw === undefined ? '' : JSON.stringify(raw);
        return `<td title="${escapeHtml(title)}">${valueText(raw)}</td>`;
      }).join('')}</tr>`).join('');
      return `
        <div class="section-label">generated_at</div>
        <div class="table-wrap"><table><tbody><tr><th>generated_at</th><td title="${escapeHtml(body?.generated_at ?? '')}">${valueText(body?.generated_at)}</td></tr></tbody></table></div>
        <div class="section-label">sessions</div>
        <div class="table-wrap"><table><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function render() {
      if (!lastBody) {
        resultEl.innerHTML = '<pre>{}</pre>';
        return;
      }
      if (rawMode) {
        resultEl.innerHTML = `<pre>${escapeHtml(JSON.stringify(lastBody, null, 2))}</pre>`;
        rawToggle.textContent = 'View table';
      } else {
        resultEl.innerHTML = renderTable(lastBody);
        rawToggle.textContent = 'View raw JSON';
      }
    }

    async function fetchSessions() {
      const url = buildUrl();
      requestUrlEl.textContent = url.pathname + url.search;
      statusEl.className = 'status';
      statusEl.textContent = 'loading';
      try {
        const response = await fetch(url);
        lastBody = await response.json();
        statusEl.textContent = `${response.status} ${response.statusText || 'OK'}`;
        if (!response.ok) statusEl.classList.add('error');
      } catch (error) {
        lastBody = { error: { code: 'client', message: error.message, details: {} } };
        statusEl.textContent = 'client error';
        statusEl.classList.add('error');
      }
      render();
    }

    function scheduleFetch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(fetchSessions, 250);
    }

    function configureAutoRefresh() {
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = autoRefresh.checked ? setInterval(fetchSessions, 5000) : null;
    }

    inputs.forEach(input => input.addEventListener('input', scheduleFetch));
    autoRefresh.addEventListener('change', configureAutoRefresh);
    rawToggle.addEventListener('click', () => { rawMode = !rawMode; render(); });
    window.addEventListener('beforeunload', () => { if (autoTimer) clearInterval(autoTimer); });
    fetchSessions();
  </script>
</body>
</html>
