<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mm - /api/v1/tokens/active</title>
  <style>
    :root {
      --bg: #0a0e14;
      --panel-bg: rgba(255, 255, 255, 0.035);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #e6edf3;
      --text-muted: rgba(230, 237, 243, 0.55);
      --accent: #7ec8e3;
      --accent-2: #b794f6;
      --danger: #f87171;
      --warn: #fbbf24;
      --accent-glow: rgba(126, 200, 227, 0.15);
      --blur: 16px;
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px;
      --r: 8px;
      --f: 'Monaco', 'Menlo', 'Consolas', monospace;
      --tr: 150ms ease-out;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      background:
        radial-gradient(ellipse 800px 600px at 15% 10%, rgba(126, 200, 227, 0.10) 0%, transparent 55%),
        radial-gradient(ellipse 700px 500px at 85% 90%, rgba(183, 148, 246, 0.10) 0%, transparent 55%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--f);
      font-size: 14px;
      line-height: 1.55;
    }

    .app { max-width: 1280px; margin: 0 auto; padding: var(--sp-6) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }
    .title { font-size: 13px; font-weight: 700; letter-spacing: 0.28em; color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); padding: 0 var(--sp-2); }
    .endpoint { color: var(--text-muted); font-size: 12px; padding: 0 var(--sp-2); margin-top: calc(-1 * var(--sp-2)); overflow-wrap: anywhere; }
    .panel {
      background: var(--panel-bg);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border: 1px solid var(--panel-border);
      border-radius: var(--r);
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.35);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr)) auto auto;
      gap: var(--sp-2);
      padding: var(--sp-3);
      align-items: end;
    }
    label { display: flex; flex-direction: column; gap: var(--sp-1); color: var(--text-muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    input {
      width: 100%;
      min-width: 0;
      padding: var(--sp-2) var(--sp-3);
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      outline: none;
    }
    input:focus { border-color: rgba(126, 200, 227, 0.5); }
    .toggle { flex-direction: row; align-items: center; align-self: center; text-transform: none; letter-spacing: 0; white-space: nowrap; }
    .toggle input { width: auto; }
    .btn {
      padding: var(--sp-2) var(--sp-3);
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { background: rgba(126, 200, 227, 0.1); }
    .meta { display: flex; justify-content: space-between; gap: var(--sp-3); padding: 0 var(--sp-3) var(--sp-3); color: var(--text-muted); font-size: 11px; flex-wrap: wrap; }
    .status.error { color: var(--danger); }
    .table-wrap { overflow-x: auto; padding: var(--sp-3); }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--panel-border); padding: var(--sp-2); text-align: left; vertical-align: top; white-space: nowrap; }
    th { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    td { color: var(--text); font-size: 12px; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:hover td { background: rgba(255, 255, 255, 0.025); }
    .section-label { color: var(--accent-2); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: var(--sp-3) var(--sp-3) 0; }
    .null { color: var(--text-muted); }
    .state-working { color: var(--accent); }
    .state-idle { color: var(--text-muted); }
    .state-wedged { color: var(--warn); }
    .tok-hot { color: var(--danger); font-weight: 700; }
    .tok-warm { color: var(--warn); }
    .truncate-id { max-width: 140px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }
    pre { margin: 0; padding: var(--sp-4); overflow: auto; max-height: 70vh; color: var(--text); font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    @media (max-width: 900px) { .controls { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
<!--NAV-->
  <main class="app">
    <div class="title">MNEMONIC · R1 MONITOR</div>
    <div class="endpoint">Monitoring: GET /api/v1/tokens/active — latest-turn context-window fill across active sessions</div>

    <section class="panel">
      <div class="controls">
        <label>vendor <input id="vendor" type="text" placeholder="claude / codex / gemini" autocomplete="off" /></label>
        <label>state <input id="state" type="text" placeholder="working,idle,wedged" autocomplete="off" /></label>
        <label>project <input id="project" type="text" placeholder="ac,mm" autocomplete="off" /></label>
        <label>role <input id="role" type="text" placeholder="cto,find,..." autocomplete="off" /></label>
        <label class="toggle"><input id="autoRefresh" type="checkbox" /> auto-refresh 5s</label>
        <button id="rawToggle" class="btn" type="button">View raw JSON</button>
      </div>
      <div class="meta">
        <span id="requestUrl"></span>
        <span id="status" class="status"></span>
      </div>
    </section>

    <section class="panel" id="result"></section>
  </main>

  <script>
    const inputs = {
      vendor:  document.getElementById('vendor'),
      state:   document.getElementById('state'),
      project: document.getElementById('project'),
      role:    document.getElementById('role'),
    };
    const resultEl = document.getElementById('result');
    const requestUrlEl = document.getElementById('requestUrl');
    const statusEl = document.getElementById('status');
    const rawToggle = document.getElementById('rawToggle');
    const autoRefresh = document.getElementById('autoRefresh');
    let lastBody = null;
    let rawMode = false;
    let autoTimer = null;
    let debounceTimer = null;

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function formatTokens(value) {
      if (value === null || value === undefined) return '<span class="null">—</span>';
      const n = Number(value);
      if (!Number.isFinite(n)) return '<span class="null">—</span>';
      const display = n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
      // Color hint: >150k is hot, >80k is warm. Tuned for typical 200k Claude windows.
      const cls = n >= 150_000 ? 'tok-hot' : n >= 80_000 ? 'tok-warm' : '';
      return cls ? `<span class="${cls}">${display}</span>` : display;
    }

    function formatCost(value) {
      if (value === null || value === undefined) return '<span class="null">—</span>';
      const n = Number(value);
      if (!Number.isFinite(n)) return '<span class="null">—</span>';
      return '$' + n.toFixed(2);
    }

    function formatAge(iso) {
      if (!iso) return '<span class="null">—</span>';
      const ms = Date.now() - Date.parse(iso);
      if (!Number.isFinite(ms) || ms < 0) return escapeHtml(iso);
      const s = Math.floor(ms / 1000);
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    function formatState(state) {
      if (!state) return '<span class="null">—</span>';
      const cls = `state-${state}`;
      return `<span class="${cls}">${escapeHtml(state)}</span>`;
    }

    function formatId(id, max = 16) {
      if (!id) return '<span class="null">—</span>';
      const s = String(id);
      const short = s.length > max ? s.slice(0, max) + '…' : s;
      return `<span class="truncate-id" title="${escapeHtml(s)}">${escapeHtml(short)}</span>`;
    }

    function buildUrl() {
      const url = new URL('/api/v1/tokens/active', location.origin);
      for (const [key, el] of Object.entries(inputs)) {
        const v = el.value.trim();
        if (v) url.searchParams.set(key, v);
      }
      return url;
    }

    function renderError(body) {
      const details = body.error.details ?? {};
      return `
        <div class="section-label">error</div>
        <div class="table-wrap"><table><tbody>
          <tr><th>code</th><td>${escapeHtml(body.error.code)}</td></tr>
          <tr><th>message</th><td>${escapeHtml(body.error.message)}</td></tr>
          <tr><th>details</th><td>${escapeHtml(JSON.stringify(details))}</td></tr>
        </tbody></table></div>`;
    }

    function renderTable(body) {
      if (body?.error) return renderError(body);
      const rows = Array.isArray(body?.participants) ? body.participants : [];
      const statePriority = { working: 0, idle: 1, wedged: 2, orphan: 3, completed: 4 };
      const sorted = [...rows].sort((a, b) =>
        (statePriority[a.state] ?? 99) - (statePriority[b.state] ?? 99)
        || (b.tokens ?? -1) - (a.tokens ?? -1)
      );
      const headers = ['participant_id','project_role','vendor','tokens','cost_usd','state','age','model','session_id']
        .map(h => `<th>${h}</th>`).join('');
      const tableRows = sorted.map(row => `
        <tr>
          <td>${escapeHtml(row.participant_id ?? '')}</td>
          <td>${escapeHtml(row.project_role ?? '')}</td>
          <td>${escapeHtml(row.vendor ?? '')}</td>
          <td class="num">${formatTokens(row.tokens)}</td>
          <td class="num">${formatCost(row.cost_usd)}</td>
          <td>${formatState(row.state)}</td>
          <td>${formatAge(row.last_activity_at)}</td>
          <td>${escapeHtml(row.model ?? '')}</td>
          <td>${formatId(row.session_id, 16)}</td>
        </tr>`).join('');
      return `
        <div class="section-label">generated_at · ${rows.length} session${rows.length === 1 ? '' : 's'}</div>
        <div class="table-wrap"><table><tbody>
          <tr><th>generated_at</th><td>${escapeHtml(body?.generated_at ?? '')}</td></tr>
        </tbody></table></div>
        <div class="section-label">participants</div>
        <div class="table-wrap"><table><thead><tr>${headers}</tr></thead><tbody>${tableRows}</tbody></table></div>`;
    }

    function render() {
      if (!lastBody) {
        resultEl.innerHTML = '<pre>{}</pre>';
        return;
      }
      if (rawMode) {
        resultEl.innerHTML = `<pre>${escapeHtml(JSON.stringify(lastBody, null, 2))}</pre>`;
        rawToggle.textContent = 'View table';
      } else {
        resultEl.innerHTML = renderTable(lastBody);
        rawToggle.textContent = 'View raw JSON';
      }
    }

    async function fetchTokens() {
      const url = buildUrl();
      requestUrlEl.textContent = url.pathname + url.search;
      statusEl.className = 'status';
      statusEl.textContent = 'loading';
      try {
        const response = await fetch(url);
        lastBody = await response.json();
        statusEl.textContent = `${response.status} ${response.statusText || 'OK'}`;
        if (!response.ok) statusEl.classList.add('error');
      } catch (error) {
        lastBody = { error: { code: 'client', message: error.message, details: {} } };
        statusEl.textContent = 'client error';
        statusEl.classList.add('error');
      }
      render();
    }

    function scheduleFetch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(fetchTokens, 250);
    }

    function configureAutoRefresh() {
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = autoRefresh.checked ? setInterval(fetchTokens, 5000) : null;
    }

    for (const el of Object.values(inputs)) el.addEventListener('input', scheduleFetch);
    autoRefresh.addEventListener('change', configureAutoRefresh);
    rawToggle.addEventListener('click', () => { rawMode = !rawMode; render(); });
    window.addEventListener('beforeunload', () => { if (autoTimer) clearInterval(autoTimer); });
    fetchTokens();
  </script>
</body>
</html>
